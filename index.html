<!DOCTYPE html>
<html lang="en">
<head>

    <title>Queres gaseosa - One Page</title>
    <!--Boostrap cdn-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullPage.js/2.9.7/jquery.fullpage.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol&family=Shojumaru&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles1.css">
</head>
<body style="background-color: #FFFACD;">


<nav class="navbar fixed-top navbar-expand justify-content-start navbar-dark p-3 shadow-lg" style="background-color: #4d694e;">
<!--Menu de navegacion funcional-->
<ul id="menu" class="navbar-nav gap-4">
    <li data-menuanchor="inicio" class="navbar-brand titulo"><a href="#inicio" class="nav-link">Inicio <img src="https://flagcdn.com/jp.svg" class="rounded shadow-lg" alt="Japón" style="width: 40px; height: 24px; object-fit: cover; margin-left: 8px; margin-top: -3px;"></a></li>
    <li data-menuanchor="presentacion" class="nav-item titulo"><a href="#presentacion" class="nav-link">Presentacion</a></li>

    <li data-menuanchor="galeria" class="nav-item titulo"><a href="#galeria" class="nav-link">Galeria</a></li>

</ul>
</nav>


<!--contenedor principal de FullPage-->
<div id="fullpage">

        <h2 class="purple">Productos</h2>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fullPage.js/2.9.7/jquery.fullpage.min.js"></script>

<script>
$(document).ready(function() {
    $('#fullpage').fullpage({
        anchors: ['inicio','presentacion','productos','galeria','contacto'],
        menu: '#menu',
        navigation: true, 
        navigationPosition: 'right',
        scrollingSpeed: 700
